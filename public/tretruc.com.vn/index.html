<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>tretruc.com.vn - Smart content Web100</title>
<style>
  /* Danh sách bài nháp của 1 domain. Bài + trạng thái: posts.json cạnh file này
     ("editing" = Đang chỉnh sửa, "approved" = Đã duyệt). Số góp ý lấy trực tiếp từ /api/counts. */
  :root{--ink:#15201a;--muted:#5b6b63;--line:#e3e8e5;--g:#078c46;--bg:#f2fbf6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:960px;margin:0 auto;padding:40px 16px}
  h1{margin:0 0 4px;font-size:26px;letter-spacing:-.5px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:15px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(21,32,26,.06)}
  th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
  th{background:#e7fbf0;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  td.no{width:60px;color:var(--muted);font-weight:700}
  td a{color:var(--g);font-weight:700;text-decoration:none}
  td a:hover{text-decoration:underline}
  .slug{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;word-break:break-all}
  .cnt b{font-size:17px}
  .cnt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .st{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
  .st--approved{background:#dcfce7;color:#166534}
  .st--editing{background:#fef3c7;color:#92400e}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  @media (max-width:640px){
    main{padding:28px 12px}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border-bottom:1px solid var(--line);padding:10px 0}
    td{border:0;padding:6px 16px}
    td.no{width:auto}
    td[data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  }
</style>
</head>
<body>
<main>
  <h1 id="domain">tretruc.com.vn</h1>
  <p class="sub">Bài viết Smart content đang duyệt nội dung</p>
  <table>
    <thead><tr><th>STT</th><th>Bài viết</th><th>Số góp ý</th><th>Trạng thái</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" class="empty">Đang tải...</td></tr></tbody>
  </table>
</main>
<script>
(async () => {
  const domain = location.pathname.split('/').filter(Boolean)[0];
  document.getElementById('domain').textContent = domain;
  const rows = document.getElementById('rows');
  const STATUS = { approved: 'Đã duyệt', editing: 'Đang chỉnh sửa' };
  const el = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => (k === 'class' ? (e.className = v) : e.setAttribute(k, v)));
    kids.forEach((k) => k != null && e.append(k));
    return e;
  };
  let posts = [], counts = {};
  try { posts = await (await fetch('posts.json', { cache: 'no-store' })).json(); } catch { posts = []; }
  try {
    const r = await (await fetch('/api/counts?domain=' + encodeURIComponent(domain))).json();
    (r.counts || []).forEach((c) => { counts[c.page] = c; });
  } catch { counts = null; }
  if (!posts.length) {
    rows.replaceChildren(el('tr', {}, el('td', { colspan: 4, class: 'empty' }, 'Chưa có bài viết nào.')));
    return;
  }
  rows.replaceChildren(...posts.map((p, i) => {
    const path = '/' + domain + '/' + p.slug + '/';
    const c = counts ? counts[path] || { open: 0, fixed: 0 } : null;
    const total = c ? c.open + c.fixed : null;
    const status = STATUS[p.status] ? p.status : 'editing';
    return el('tr', {},
      el('td', { class: 'no' }, String(i + 1)),
      el('td', { 'data-label': 'Bài viết' }, el('a', { href: path }, p.title), el('span', { class: 'slug' }, path)),
      el('td', { 'data-label': 'Số góp ý', class: 'cnt' },
        el('b', {}, total == null ? '–' : String(total)),
        c && total ? el('small', {}, c.open + ' chờ sửa · ' + c.fixed + ' đã sửa') : null),
      el('td', { 'data-label': 'Trạng thái' }, el('span', { class: 'st st--' + status }, STATUS[status])));
  }));
})();
</script>
</body>
</html>
